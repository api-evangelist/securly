  - Gated
  - Partner
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.securly.com/docs/api-connections
  properties:
  - url: https://docs.securly.com/docs/api-connections
    type: Documentation
  description: Credential-gated MDM API that lets an approved third-party system
    assign or unassign students to and from devices managed in Securly MDM. Uses the
    same per-tenant API connection credentials (Client ID, Password, API URL, Token
    URL) as the device inventory API. No public endpoint reference or OpenAPI is
    published by Securly; endpointsModeled - not sourced from a public reference.
