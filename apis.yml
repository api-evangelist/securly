    type: Documentation
  description: Credential-gated MDM API that lets an approved third-party asset or
    device-management system pull an inventory list of devices (iPads, Macs, Apple
    TVs) managed in Securly MDM. Access is provisioned per tenant from MDM to
    Settings to API connections, which issues a Client ID, a connection-specific
    Password, an API URL, and a Token URL for a token-based (OAuth-style) exchange.
    Securly does not publish a public endpoint reference or OpenAPI for this API;
    endpoints are modeled here from the documented capability and are not fabricated
    as a verified surface. endpointsModeled - not sourced from a public reference.
- aid: securly:securly-mdm-student-assignment-api
  name: Securly MDM Student Assignment API
  tags:
