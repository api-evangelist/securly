name: Securly
kind: company
description: Securly is a K-12 student safety company whose platform spans web filtering,
  device management (MDM), classroom management, and student wellness/self-harm and
  threat monitoring across the web, email, and cloud drives. Securly is deployed by
  school districts and integrates with the school technology stack - Google Workspace,
  Microsoft 365/Entra, Apple School Manager, and Student Information Systems via the
  OneRoster and rostering standards. Securly's public developer surface is limited
  and access-gated - it primarily CONSUMES rostering and identity APIs from external
  systems rather than exposing a documented public developer API. The one
  provider-exposed API is a credential-gated Securly MDM API used by third-party
  device/asset systems to pull device inventory and assign or unassign students to
  devices; its endpoints and base URL are provisioned per tenant and are not publicly
  documented as a reference.
